server {
    listen 80;
	
	# Keep relative redirect paths so the host port (e.g. 3050) isn't stripped out
    absolute_redirect off;
	
	#root /usr/share/nginx/html;
    #index index.html index.htm;



    # This Nginx configuration block defines a URL routing rule for handling requests that start with /odrl-editor-demo.
    # Here is a breakdown of what each line does:

        # location /odrl-editor-demo { ... }: This matches any incoming HTTP requests whose path begins with /odrl-editor-demo (for example, [http://yourdomain.com/odrl-editor-demo/about](http://yourdomain.com/odrl-editor-demo/about)).

        # alias /usr/share/nginx/html;: This maps the /odrl-editor-demo URL path to the physical directory /usr/share/nginx/html on the server's filesystem. When a request comes in, Nginx looks inside this directory for the requested files.

        # try_files $uri $uri/ /odrl-editor-demo/index.html;: This is crucial for Single Page Applications (SPAs) (like React, Vue, or Angular apps):

            # $uri: First, Nginx checks if the exact file requested exists in the alias directory.

            # $uri/: Second, it checks if a directory with that name exists.

            # /odrl-editor-demo/index.html: If neither the file nor the directory is found, Nginx falls back to serving the main index.html file. This allows client-side routing to handle the URL correctly without throwing a 404 Not Found error when refreshing the page.
	
    # Serve frontend assets under the subpath
    location /odrl-editor-demo {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /odrl-editor-demo/index.html;
    }

    # Fallback root redirect if hitting container directly
    location / {
        return 301 /odrl-editor-demo/;
		# alias /usr/share/nginx/html;
        # try_files $uri $uri/ /index.html;
    }

    # Proxy API requests. 
    # Handles both /api/... (if stripped by remote nginx) and /odrl-editor-demo/api/...
    location ~ ^/(odrl-editor-demo/)?api {
        rewrite ^/odrl-editor-demo(/api.*)$ $1 break;
        proxy_pass http://backend:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}